name: Construire MOI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Construire l'APK
        id: build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk MOI.apk

      - name: Publier l'APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MOI 1.0.${{ github.run_number }}
          make_latest: true
          files: MOI.apk

      - name: Enregistrer le résultat (pour Claude)
        if: always()
        run: |
          STATUS="${{ steps.build.outcome }}"
          mkdir -p /tmp/out
          echo "run=${{ github.run_number }} commit=${{ github.sha }} status=$STATUS" > /tmp/out/status.txt
          grep -E "^e: |error:|FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)" -A3 build.log | head -300 > /tmp/out/errors.txt || true
          tail -150 build.log > /tmp/out/tail.txt || true
          cd /tmp/out
          git init -q -b build-log
          git config user.name "moi-bot"
          git config user.email "moi-bot@users.noreply.github.com"
          git add -A
          git commit -qm "build ${{ github.run_number }}: $STATUS"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log
